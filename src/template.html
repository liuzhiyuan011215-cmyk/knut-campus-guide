<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KNUT 캠퍼스 꿀팁 가이드</title>
<meta name="description" content="한국교통대학교 충주캠퍼스 주변 맛집 & 숨은 힐링/공부 장소 178곳 — 한국어 / 中文">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F5; --bg2:#F0EEE6; --paper:#FFFEFB; --ink:#141413; --ink2:#3D3D3A; --muted:#75736B; --faint:#A8A59A;
  --line:#E4E0D4; --line2:#D6D1C2; --clay:#D97757; --clay-ink:#B5583A; --clay-soft:#F3DFD3; --olive:#5F7A47; --olive-soft:#E3E9D9;
  --serif:"Noto Serif KR","Noto Serif SC",Georgia,serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"PingFang SC","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --r:14px; --wrap:1180px;
}
html[lang="zh-CN"]{--serif:"Noto Serif SC","Noto Serif KR",Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
svg{flex:none}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 28px}
.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.015em}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;z-index:30;background:rgba(250,249,245,.86);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:28px;height:64px}
.brand{flex:none;display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;font-size:15px;letter-spacing:-.01em}
.brand i{width:26px;height:26px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.nav{display:flex;gap:22px;margin-left:auto;font-size:14px}
.mode{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 14px 0 8px;border-radius:999px;border:1px solid var(--line2);background:var(--paper);font-size:13.5px;font-weight:600;white-space:nowrap;transition:border-color .15s}
.mode:hover{border-color:var(--ink)}
.mode i{width:34px;height:22px;border-radius:999px;background:var(--line2);position:relative;transition:background .2s}
.mode i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s}
.mode[aria-pressed="true"] i{background:var(--clay)}
.mode[aria-pressed="true"] i:after{transform:translateX(12px)}
.go{display:none;margin-top:14px;font-size:14px;font-weight:600;color:var(--clay-ink);text-decoration:none;align-items:center;gap:6px}
.go.on{display:inline-flex}
.go:hover{text-decoration:underline}
.ext{position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:rgba(20,20,19,.62);color:#fff}
.db .ph{position:relative}
.fcredit{flex-basis:100%;font-size:12px;color:var(--faint)}
.fcredit a{color:inherit}
.nav a{text-decoration:none;color:var(--ink2)}
.nav a:hover{color:var(--ink)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--bg2);border:1px solid var(--line)}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:not([aria-pressed="true"]):hover{color:var(--ink)}

/* hero */
.hero{padding:64px 0 72px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:56px;align-items:center}
.hero .wrap>div{min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);letter-spacing:.01em}
.eyebrow b{width:6px;height:6px;border-radius:50%;background:var(--clay)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(38px,5.4vw,66px);line-height:1.12;letter-spacing:-.025em;margin:18px 0 14px}
.sub{font-size:clamp(17px,1.7vw,20px);color:var(--ink2);margin:0 0 8px;font-weight:500}
.lead{font-size:15px;color:var(--muted);max-width:34em;margin:0 0 28px}
.search{display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line2);border-radius:var(--r);padding:0 8px 0 18px;height:58px;box-shadow:0 1px 0 rgba(20,20,19,.03),0 8px 24px -16px rgba(20,20,19,.18);transition:border-color .15s}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:600;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn-ink{background:var(--ink);color:var(--bg)}
.btn-ink:hover{background:#2b2b29}
.btn-clay{background:var(--clay);color:#fff}
.btn-clay:hover{background:var(--clay-ink)}
.btn-line{border:1px solid var(--line2);background:var(--paper)}
.btn-line:hover{border-color:var(--ink)}
.scenes{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--paper);font-size:13.5px;font-weight:500;color:var(--ink2);white-space:nowrap;transition:border-color .15s,background .15s,color .15s}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip small{font-size:12px;color:var(--faint);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] small{color:#b9b6ab}
.chip.rand{background:var(--clay);border-color:var(--clay);color:#fff}
.chip.rand:hover{background:var(--clay-ink);border-color:var(--clay-ink)}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);margin-top:40px;border-top:1px solid var(--line)}
.ledger div{padding:14px 0 0}
.ledger div+div{padding-left:18px;border-left:1px solid var(--line)}
.ledger b{display:block;font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.ledger span{font-size:12.5px;color:var(--muted)}
.mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:150px 120px 150px;gap:12px}
.tile{position:relative;overflow:hidden;border-radius:16px;background:var(--bg2);display:block;width:100%;height:100%}
.tile img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.tile:hover img{transform:scale(1.035)}
.tile span{position:absolute;left:10px;bottom:10px;padding:4px 10px;border-radius:999px;background:rgba(250,249,245,.92);font-size:12px;font-weight:600;color:var(--ink)}
.t1{grid-row:1/3}.t2{grid-column:2}.t3{grid-column:2;grid-row:2/4}.t4{grid-row:3}
.credit{margin-top:10px;font-size:11.5px;color:var(--faint);text-align:right}

/* sections */
section.block{padding:72px 0;border-top:1px solid var(--line)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:28px}
.kicker{font-size:13px;color:var(--clay-ink);font-weight:600;letter-spacing:.02em;margin:0 0 8px}
h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3.4vw,40px);line-height:1.2;letter-spacing:-.02em;margin:0}

/* rail */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:250px;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.pc{scroll-snap-align:start;text-align:left;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:border-color .15s,transform .2s}
.pc:hover{border-color:var(--line2);transform:translateY(-2px)}
.pc .ph{height:190px;background:var(--bg2);position:relative;overflow:hidden}
.pc .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pc .ph.type{display:flex;align-items:flex-end;padding:16px;background:linear-gradient(160deg,var(--bg2),#E8E4D8)}
.pc .ph.type em{font-style:normal;font-family:var(--serif);font-size:26px;line-height:1.25;color:var(--ink2);letter-spacing:-.02em}
.rank{position:absolute;top:12px;left:12px;font-family:var(--serif);font-size:15px;background:rgba(250,249,245,.92);border-radius:999px;padding:2px 10px}
.pc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc h3{font-size:16px;font-weight:600;margin:0;line-height:1.35}
.pc p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc .ft{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.arrows{display:flex;gap:8px}
.arr{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);display:grid;place-items:center;background:var(--paper)}
.arr:hover{border-color:var(--ink)}

/* tips */
.tips{display:grid;grid-template-columns:300px 1fr;gap:20px}
.tiplist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.tiplist button{display:flex;gap:14px;align-items:baseline;padding:16px 4px;border-bottom:1px solid var(--line);text-align:left;color:var(--muted);transition:color .15s}
.tiplist button em{font-style:normal;font-family:var(--serif);font-size:14px;color:var(--faint)}
.tiplist button span{font-size:15px;font-weight:500}
.tiplist button:hover{color:var(--ink)}
.tiplist button[aria-selected="true"]{color:var(--ink)}
.tiplist button[aria-selected="true"] em{color:var(--clay)}
.tipcard{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:32px 36px}
.tipcard .badge{display:inline-block;font-size:12.5px;font-weight:600;color:var(--clay-ink);background:var(--clay-soft);border-radius:999px;padding:3px 11px}
.tipcard h3{font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.3;letter-spacing:-.015em;margin:14px 0 18px}
.tipcard p{margin:0 0 22px;color:var(--ink2);font-size:15.5px;line-height:1.75}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:0 0 22px}
.facts div{padding:14px 16px 14px 0}
.facts div+div{padding-left:16px;border-left:1px solid var(--line)}
.facts dt{font-size:12px;color:var(--muted);margin-bottom:4px}
.facts dd{margin:0;font-size:14px;font-weight:500;line-height:1.5}

/* directory */
.tool{display:flex;flex-direction:column;gap:14px;margin-bottom:22px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.row .search{height:46px;flex:1;min-width:240px;box-shadow:none;border-radius:999px;padding-left:16px}
.row .search input{font-size:15px}
.clear{width:28px;height:28px;border-radius:50%;display:none;place-items:center;color:var(--muted)}
.clear:hover{background:var(--bg2);color:var(--ink)}
.search.has .clear{display:grid}
.lbl{white-space:nowrap;font-size:12.5px;color:var(--muted);margin-right:2px}
.sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.chip.sm{height:32px;padding:0 12px;font-size:13px}
.sort{position:relative;margin-left:auto}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:180px;background:var(--paper);border:1px solid var(--line2);border-radius:12px;padding:6px;box-shadow:0 18px 40px -18px rgba(20,20,19,.3);z-index:5;display:none;list-style:none;margin:0}
.menu.open{display:block}
.menu li{padding:9px 12px;border-radius:8px;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.menu li:hover,.menu li.kb{background:var(--bg2)}
.menu li[aria-selected="true"]{font-weight:600}
.sum{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:14px;color:var(--ink2)}
.sum b{font-weight:600;color:var(--ink)}
.tag-ok{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--olive);background:var(--olive-soft);padding:3px 10px;border-radius:999px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink2)}
.switch i{width:36px;height:20px;border-radius:999px;background:var(--line2);position:relative;transition:background .15s}
.switch i:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch[aria-checked="true"] i{background:var(--clay)}
.switch[aria-checked="true"] i:after{transform:translateX(16px)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:10px;padding:20px 20px 16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s,box-shadow .2s}
.card:hover{border-color:var(--line2);box-shadow:0 14px 30px -22px rgba(20,20,19,.35)}
.card.cand{background:transparent;border-style:dashed;border-color:var(--line2)}
.card .meta{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted)}
.cat{display:inline-flex;align-items:center;gap:6px}
.cat:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--clay)}
.cat.h:before{background:var(--olive)}
.card h3{margin:0;font-size:18px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.card h3 small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);margin-top:2px}
.card .menu-l{font-size:14px;color:var(--ink2);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.facts-s{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--ink2);margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.facts-s div{display:flex;gap:8px;align-items:flex-start}
.facts-s svg{margin-top:3px;color:var(--faint)}
.na{color:var(--faint)}
.pill{display:inline-flex;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--bg2);color:var(--ink2)}
.pill.o{background:var(--olive-soft);color:var(--olive)}
.pill.c{background:var(--clay-soft);color:var(--clay-ink)}
.reason{font-size:12.5px;color:var(--clay-ink);margin:0}
.divider{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin:14px 0 4px;font-size:13.5px;color:var(--clay-ink);font-weight:500}
.divider:after{content:"";flex:1;height:1px;background:repeating-linear-gradient(90deg,var(--clay-soft) 0 6px,transparent 6px 10px)}
.empty{grid-column:1/-1;text-align:center;padding:56px 0;color:var(--muted)}
.pager{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:28px}
.pager button{min-width:38px;height:38px;padding:0 10px;border-radius:10px;font-size:14px;color:var(--ink2)}
.pager button:hover:not(:disabled){background:var(--bg2)}
.pager button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.pager button:disabled{color:var(--faint);cursor:default}
.pager .dots{color:var(--faint);padding:0 4px}

/* principles */
.princ{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--ink)}
.princ div{padding:22px 24px 0 0}
.princ div+div{padding-left:24px;border-left:1px solid var(--line)}
.princ b{display:block;font-family:var(--serif);font-weight:500;font-size:24px;letter-spacing:-.02em;margin-bottom:10px}
.princ p{margin:0;font-size:14.5px;color:var(--ink2);line-height:1.7}
footer{padding:40px 0 56px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:24px}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,20,19,.32);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);z-index:41;transform:translateX(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:-24px 0 60px -30px rgba(20,20,19,.4)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.x{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.x:hover{background:var(--bg2)}
.db{overflow-y:auto;padding:24px 28px 32px;flex:1}
.db .ph{border-radius:14px;overflow:hidden;margin-bottom:20px;background:var(--bg2);aspect-ratio:4/3}
.db .ph img{width:100%;height:100%;object-fit:cover;display:block}
.db h3{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.25;letter-spacing:-.02em;margin:8px 0 2px}
.db .alt{color:var(--muted);font-size:14px;margin:0 0 18px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.dl{margin:0;border-top:1px solid var(--line)}
.dl div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dl dt{color:var(--muted);font-size:13px}
.dl dd{margin:0}
.dl dd small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.note{margin-top:20px;padding:16px 18px;border-radius:12px;background:var(--bg2);font-size:14px;line-height:1.7;color:var(--ink2)}
.note h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.note.tip{background:var(--clay-soft)}
.note.tip h4{color:var(--clay-ink)}
details.orig{margin-top:10px;font-size:13px;color:var(--muted)}
details.orig summary{cursor:pointer}
.src{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.src span{font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);font-size:14px;padding:10px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:960px){
  .hero .wrap{grid-template-columns:minmax(0,1fr);gap:40px}
  .mosaic{grid-template-rows:130px 100px 130px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .tips{grid-template-columns:1fr}
  .tiplist{flex-direction:row;overflow-x:auto;border:0;gap:8px}
  .tiplist button{flex:none;border:1px solid var(--line2);border-radius:999px;padding:8px 14px}
  .tiplist button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .tiplist button em{display:none}
  .nav{display:none}
  .top .mode{margin-left:auto}
}
@media (max-width:640px){
  .wrap{padding:0 16px}
  .brand span{display:none}
  .hero{padding:36px 0 48px}
  section.block{padding:52px 0}
  .ledger{grid-template-columns:repeat(2,1fr)}
  .ledger div:nth-child(3){border-left:0;padding-left:0}
  .grid{grid-template-columns:1fr}
  #cats{max-width:100%;overflow-x:auto;scrollbar-width:none}
  .scenes,.row.scroll{flex-wrap:nowrap;overflow-x:auto;margin-right:-16px;padding-right:16px;scrollbar-width:none}
  .tipcard{padding:24px 20px}
  .facts,.princ{grid-template-columns:1fr}
  .facts div+div,.princ div+div{border-left:0;padding-left:0;border-top:1px solid var(--line)}
  .princ div{padding-bottom:18px}
  .sort{margin-left:0}
  .menu{left:0;right:auto}
  .db{padding:20px}
  .arrows{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<header class="top" id="top">
  <div class="wrap">
    <a class="brand" href="#"><i><svg width="14" height="14"><use href="#i-pin" style="color:#FAF9F5"/></svg></i><span data-t="brand"></span></a>
    <nav class="nav" id="nav"></nav>
    <button class="mode" id="modeBtn" aria-pressed="false"><i></i><span data-t="modeBtn"></span></button>
  </div>
</header>

<main>
<section class="hero">
  <div class="wrap">
    <div>
      <span class="eyebrow"><b></b><span data-t="eyebrow"></span></span>
      <h1 data-th="h1"></h1>
      <p class="sub" data-t="sub"></p>
      <p class="lead" data-t="lead"></p>
      <form class="search" id="heroSearch" role="search">
        <svg width="20" height="20" class="muted"><use href="#i-search"/></svg>
        <input id="heroQ" type="search" autocomplete="off" data-tp="searchPh">
        <button class="btn btn-ink" type="submit"><span data-t="find"></span><svg width="16" height="16"><use href="#i-arrow"/></svg></button>
      </form>
      <div class="scenes" id="scenes"></div>
      <a class="go" id="go" href="#all"></a>
      <div class="ledger" id="ledger"></div>
    </div>
    <div>
      <div class="mosaic" id="mosaic"></div>
      <div class="credit" data-t="credit"></div>
    </div>
  </div>
</section>

<section class="block" id="picks">
  <div class="wrap">
    <div class="head">
      <div>
        <p class="kicker" data-t="picksKicker"></p>
        <h2 data-t="picksTitle"></h2>
      </div>
      <div class="seg" role="tablist" id="pickTabs"></div>
    </div>
    <div id="pickBody"></div>
  </div>
</section>

<section class="block" id="all">
  <div class="wrap">
    <div class="head">
      <div>
        <p class="kicker" data-t="allKicker"></p>
        <h2 data-t="allTitle"></h2>
      </div>
    </div>
    <div class="tool">
      <div class="row">
        <div class="seg" id="cats" role="group"></div>
        <label class="search" id="dirSearch">
          <svg width="18" height="18" class="muted"><use href="#i-search"/></svg>
          <input id="q" type="search" autocomplete="off" data-tp="searchPh2">
          <button type="button" class="clear" id="qClear" aria-label="clear"><svg width="14" height="14"><use href="#i-x"/></svg></button>
        </label>
      </div>
      <div class="row scroll" id="filters"></div>
    </div>
    <div class="sum" id="sum"></div>
    <div class="grid" id="grid"></div>
    <nav class="pager" id="pager" aria-label="pagination"></nav>
  </div>
</section>

<section class="block" id="data">
  <div class="wrap">
    <div class="head"><div><p class="kicker" data-t="dataKicker"></p><h2 data-t="dataTitle"></h2></div></div>
    <div class="princ" id="princ"></div>
  </div>
</section>
</main>

<footer><div class="wrap"><span data-t="foot1"></span><span data-t="foot2"></span><span class="fcredit" data-th="credit2"></span></div></footer>

<div class="scrim" id="scrim"></div>

  <div class="dh"><span class="muted" id="dHead" style="font-size:13px"></span><button class="x" id="dClose" aria-label="close"><svg width="18" height="18"><use href="#i-x"/></svg></button></div>
  <div class="db" id="dBody"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

/*__APP__*/
